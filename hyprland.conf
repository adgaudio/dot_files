# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# for agp1
#
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

monitor=eDP-1,preferred,auto,2,bitdepth,8
monitor=HEADLESS-2,3840x2400@60,auto,2,bitdepth,8
# monitor=HDMI-A-1,preferred,auto-up,auto
$external_monitor=HDMI-A-1,1920x1080@60.00Hz,auto-up,auto,bitdepth,8
$external_monitor_mirrored=$external_monitor,mirror,eDP-1
monitor = $external_monitor_mirrored


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty tmux new-session -t 0 -f active-pane -f ignore-size
$fileManager = thunar
#$menu = wofi --show drun
# $menu = fuzzel
$menu = rofi -show combi -combi-modes window,drun  -theme fancy2




#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = dunst  # notification daemon
exec-once=/usr/lib/polkit-kde-authentication-agent-1  # authentication agent
exec-once = hypridle
# exec-once = hyprpm reload -n  # hyprland plugins
# hyprpaper & firefox
exec-once = tmux setenv -g "HYPRLAND_INSTANCE_SIGNATURE" "${HYPRLAND_INSTANCE_SIGNATURE}"

# exec-once = ~/.config/hypr/scripts/hyprland_sleep.sh


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# env = XDG_CURRENT_DESKTOP,Hyprland
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
# env = AQ_DRM_DEVICES,/dev/dri/card1,/dev/dri/card0


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 0
    gaps_out = 0

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master

    snap {
        enabled = true
    }
}
cursor {
    no_warps = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false  # uses battery power
        range = 4
        render_power = 3
        # col.shadow = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    # new_is_master = true
    # orientation = right
    # no_gaps_when_only = -1
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    background_color = 0x000000

    focus_on_activate = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    # follow_mouse = 1
    # mouse_refocus = false

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = 1
        drag_lock = 1
        drag_3fg = 1
    }

    repeat_delay = 180
    repeat_rate = 120
    accel_profile = adaptive
    sensitivity = 0.7 # -1.0 - 1.0, 0 means no modification.

    # mouse_refocus = false  # needed for bambulab to not hide the dropdowns
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGS ###
####################

# Multimedia
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
# Keyboard backlight
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Power button
bind = , xf86poweroff , exec, systemctl suspend

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT # Sets "Alt" key as main modifier

# external monitor mirroring
bind = $mainMod SHIFT, M, exec, hyprctl keyword monitor "$external_monitor_mirrored"
bind = $mainMod SHIFT, N, exec, hyprctl keyword monitor "$external_monitor"

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
# bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, B, togglesplit, # dwindle
bind = $mainMod, TAB, focuscurrentorlast
bind = $mainMod, T, togglegroup
bind = $mainMod, G, changegroupactive, f

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
# Or use $mod+[up|down|left|right]
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Previous workspace
# bind = $mainMod, Tab, workspace, m+1
# bind = $mainMod, Tab, workspace, e+1  # across monitors
bind = $mainMod SHIFT, Tab, workspace, m-1
# bind = $mainMod SHIFT, Tab, workspace, e-1  # across monitors
#
# Changing window focus and layout
bind = $mainMod SHIFT, SPACE, exec, ~/bin/hyprctl_layout_switch.sh
bind = $mainMod, SPACE, layoutmsg, orientationcycle
bind = $mainMod SHIFT, right, layoutmsg, rollnext
bind = $mainMod SHIFT, left, layoutmsg, rollprev
bind = $mainMod SHIFT, up, layoutmsg, swapwithmaster
bind = $mainMod, F, fullscreen, 1


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move workspace to monitor
bind = $mainMod, period, movecurrentworkspacetomonitor, +1
bind = $mainMod, comma, movecurrentworkspacetomonitor, -1

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1
# bind = $mainMod, TAB, focuscurrentlast

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d 

# Screenshot
bind = $mainMod SHIFT, P, exec, bash -c 'X=1; while [ -f /tmp/screenshot_$X.png ]; do X=$((X+1)); done; grimshot save area /tmp/screenshot_$X.png'

# Zoom
bind = $mainMod, mouse_down, exec, hyprctl keyword cursor_zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor_zoom_factor -j | jq '.float') + 0.5}")
bind = $mainMod, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN { z = $(hyprctl getoption cursor:zoom_factor -j | jq '.float') - 0.5; print (z < 1.0 ? 1.0 : z) }")

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# STM32CubeIDE tweaks: get dropdown working
# windowrulev2 = stayfocused, title:^(.*)$,class:^(org-eclipse-core-internal-jobs-Worker)$
# windowrulev2 = minsize 1 1, title:^(.*)$,class:^(org-eclipse-core-internal-jobs-Worker)$
#
# # Opacity rule for windows tagged "overlay2"
windowrule = border_color rgb(FF0000) rgb(880808), opacity .4, match:tag overlay2
bind = $mainMod, O, tagwindow, overlay2
# xwayland { force_zero_scaling = true } 

# Automatically place windows into groups
windowrule = match:class .*, group set

# hyprwhspr - Toggle mode (added by hyprwhspr setup)
# Press once to start, press again to stop
bindd = ALT, D, Speech-to-text, exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record
